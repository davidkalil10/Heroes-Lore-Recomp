name: heroes_lore
description: Heroes Lore - Wind of Soltia Modern Edition. A Flutter game engine bringing the classic J2ME RPG to modern platforms.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Game & Graphics
  flame: ^1.15.0
  flame_audio: ^2.2.2
  
  # State Management
  provider: ^6.0.0
  
  # Storage & Serialization
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Input handling (gamepad, keyboard)
  gamepads: ^1.2.0
  keyboard_event: ^2.6.0
  
  # Responsive UI
  responsive_builder: ^0.7.0
  
  # Data serialization
  json_serializable: ^6.8.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/game_data/
    - assets/sprites/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: GameFont
      fonts:
        - asset: assets/fonts/game_font.ttf
