name: Build Nintendo Switch NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Switch Toolchain & Portlibs
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          echo "Verificando headers SDL2 e bibliotecas..."
          ls -la $PORTLIBS/include/SDL2/SDL.h
          ls -la $PORTLIBS/lib/libSDL2.a
          ls -la $PORTLIBS/lib/libSDL2_mixer.a

      - name: Prepare RomFS Assets
        run: |
          python3 tools/prepare_switch_romfs.py
          ls -la romfs

      - name: Compile Heroes Lore NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          export LIBNX=$DEVKITPRO/libnx
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make -f Makefile.switch

      - name: Verify Output
        run: |
          ls -la heroes_lore.nro
          ls -la heroes_lore.elf
          ls -la heroes_lore.nacp
          python3 tools/inspect_nro.py heroes_lore.nro

      - name: Upload Switch NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_switch_nro
          path: heroes_lore.nro
