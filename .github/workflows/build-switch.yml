name: Build Nintendo Switch NRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Switch Dependencies
        run: |
          for conf in /opt/devkitpro/pacman/etc/pacman.conf /etc/pacman.conf; do
            if [ -f "$conf" ]; then
              echo "Configurando $conf com User-Agent de navegador..."
              sed -i 's|^#*XferCommand = .*|XferCommand = /usr/bin/curl -g -q --retry 3 --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" -L -C - -f -o %o %u|' "$conf"
            fi
          done
          for i in 1 2 3 4 5; do
            echo "Tentativa $i de instalação das bibliotecas SDL2..."
            dkp-pacman -Sy --needed --noconfirm switch-sdl2 switch-sdl2_mixer && break || sleep 3
          done

      - name: Prepare RomFS Assets
        run: |
          mkdir -p romfs
          cp -r reference/extracted romfs/
          cp -r assets romfs/
          ls -la romfs

      - name: Compile Heroes Lore NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          export LIBNX=$DEVKITPRO/libnx
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make -f Makefile.switch

      - name: Verify Output
        run: |
          ls -la heroes_lore.nro
          ls -la heroes_lore.elf
          ls -la heroes_lore.nacp
          python3 tools/inspect_nro.py heroes_lore.nro

      - name: Upload Switch NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_switch_nro
          path: heroes_lore.nro
