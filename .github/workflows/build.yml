name: Build Multiplatform & Release (Switch, Windows, Android)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub?'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag / Versão do Release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  # ==============================================================================
  # 1. Nintendo Switch (.nro Homebrew)
  # ==============================================================================
  build-switch:
    name: Nintendo Switch (.nro)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare RomFS Assets
        run: |
          python3 tools/prepare_switch_romfs.py
          ls -la romfs

      - name: Compile Heroes Lore NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          export LIBNX=$DEVKITPRO/libnx
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make -f Makefile.switch

      - name: Verify Output
        run: |
          ls -la heroes_lore.nro
          python3 tools/inspect_nro.py heroes_lore.nro

      - name: Upload Switch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_switch_nro
          path: heroes_lore.nro

  # ==============================================================================
  # 2. Windows x64 (Portable ZIP)
  # ==============================================================================
  build-windows:
    name: Windows x64 (ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            zip

      - name: Compile Windows Binary
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Windows Portable Release
        shell: msys2 {0}
        run: |
          mkdir -p dist_windows
          cp build/heroes_lore.exe dist_windows/
          # Copia DLLs do build e garante todas as DLLs de runtime necessarias do UCRT64
          cp build/*.dll dist_windows/ 2>/dev/null || true
          if [ -d "$MINGW_PREFIX/bin" ]; then
            cp "$MINGW_PREFIX"/bin/SDL2.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/SDL2_mixer.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libgcc_s_seh-1.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libstdc++-6.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libwinpthread-1.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libFLAC*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libmpg123*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libopus*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libvorbis*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libogg*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libwavpack*.dll dist_windows/ 2>/dev/null || true
            cp "$MINGW_PREFIX"/bin/libxmp*.dll dist_windows/ 2>/dev/null || true
          fi
          if [ -d "build/assets" ]; then
            cp -r build/assets dist_windows/
          else
            cp -r reference/extracted dist_windows/assets
          fi
          cd dist_windows && zip -r ../heroes_lore_windows_x64.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_windows_zip
          path: |
            heroes_lore_windows_x64.zip
            dist_windows/heroes_lore.exe

  # ==============================================================================
  # 3. Linux x86_64 (AppImage Portátil / Steam Deck)
  # ==============================================================================
  build-linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libcurl4-openssl-dev \
            pkg-config \
            wget \
            file

      - name: Compile Linux Binary
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Prepare AppDir
        run: |
          python3 tools/prepare_appimage.py

      - name: Build AppImage with appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir heroes_lore_linux_x86_64.AppImage
          chmod +x heroes_lore_linux_x86_64.AppImage
          ls -lh heroes_lore_linux_x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_linux_appimage
          path: heroes_lore_linux_x86_64.AppImage

  # ==============================================================================
  # 4. Android (APKs Universal & ARM64)
  # ==============================================================================
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Third-Party SDL2 & SDL2_mixer
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: |
            third_party/SDL2
            third_party/SDL2_mixer
          key: ${{ runner.os }}-sdl2-2.30.12-mixer-2.8.0

      - name: Fetch Third-Party SDL2 and SDL2_mixer
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/SDL2" ]; then
            git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git third_party/SDL2
          fi
          if [ ! -d "third_party/SDL2_mixer" ]; then
            git clone --depth 1 --branch release-2.8.0 https://github.com/libsdl-org/SDL_mixer.git third_party/SDL2_mixer
          fi

      - name: Verify Android Environment
        run: |
          echo "=== Android SDK & NDK Pré-instalados no Runner ==="
          ls -la "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true
          ls -la "$ANDROID_SDK_ROOT/cmake" 2>/dev/null || true
          ls -la "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Build Android Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p apks
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} apks/ \;
          ls -la apks/
          cp apks/*universal*.apk heroes_lore_android_universal.apk 2>/dev/null || true
          cp apks/*arm64-v8a*.apk heroes_lore_android_arm64.apk 2>/dev/null || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heroes_lore_android_apks
          path: |
            heroes_lore_android_universal.apk
            heroes_lore_android_arm64.apk

  # ==============================================================================
  # 5. GitHub Release Automático (Tags v* ou workflow_dispatch)
  # ==============================================================================
  release:
    name: Publicar Release Multiplataforma
    needs: [build-switch, build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Artefato Switch
        uses: actions/download-artifact@v4
        with:
          name: heroes_lore_switch_nro

      - name: Baixar Artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: heroes_lore_windows_zip

      - name: Baixar Artefato Linux
        uses: actions/download-artifact@v4
        with:
          name: heroes_lore_linux_appimage

      - name: Baixar Artefato Android
        uses: actions/download-artifact@v4
        with:
          name: heroes_lore_android_apks

      - name: Listar Arquivos do Release
        run: ls -la

      - name: Criar GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        with:
          name: "Heroes Lore: Wind of Soltia ${{ github.ref_name || inputs.release_tag }}"
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            heroes_lore.nro
            heroes_lore.exe
            heroes_lore_windows_x64.zip
            heroes_lore_linux_x86_64.AppImage
            heroes_lore_android_universal.apk
            heroes_lore_android_arm64.apk
